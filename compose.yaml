services:
  api:
    build:
      context: .
    ports:
      - "8000:8000"  # Adjust to your app's port
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/dbname
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=init-db-1
    volumes:
      - db-data:/var/lib/postgresql/data
    secrets:
      - db-password

volumes:
  db-data:
