services:
  app:
    build:
      context: ./app
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - monitoring

  nginx:
    build:
      context: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - api
    volumes:
      - ./api/site:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    networks:
      - monitoring
      - attack

  kali:
    build:
      context: ./kali
    container_name: cyberlab-kali
    stdin_open: true
    tty: true
    cap_add:
    - NET_RAW
    - NET_ADMIN
    privileged: true
    networks:
      - attack

  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
    volumes:
      - ./db/init/my-postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/init/init-db:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - monitoring

volumes:
  postgres_data:
  nginx_logs:
    name: cyberlab_nginx_logs

networks:
  monitoring:
    name: monitoring_network

  attack:
    name: star_wars
