services:
  api:
    build:
      context: ./api
    ports:
      - "8000:8000"
    environment:
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
    depends_on:
      - db

  db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
      TZ: Europe/France
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - ./db/init/my-postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/init/init-db:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

volumes:
  postgres_data:
