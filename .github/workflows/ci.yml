name: CI

on:
	push:
		branches: [ main, master ]
	pull_request:
		branches: [ main, master ]

jobs:
	test:
		runs-on: ubuntu-latest
		services:
			postgres:
				image: postgres:18
				env:
					POSTGRES_USER: postgres
					POSTGRES_PASSWORD: password
					POSTGRES_DB: postgres
				ports:
					- 5432:5432
				options: >-
					--health-cmd pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
		env:
			DB_USER: postgres
			DB_PASSWORD: password
			DB_HOST: postgres
			DB_PORT: 5432
			DB_NAME: postgres
			TEST_TARGET: prod
			PROD_BASE_URL: http://127.0.0.1:8000

		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Set up Python
				uses: actions/setup-python@v4
				with:
					python-version: '3.12'

			- name: Install dependencies
				run: |
					python -m pip install --upgrade pip
					pip install -r app/requirements.txt

			- name: Wait for Postgres
				shell: bash
				run: |
					echo "Waiting for Postgres at ${DB_HOST}:${DB_PORT}..."
					for i in {1..30}; do
						python - <<'PY' && break || true
import sys
import psycopg
try:
		conn = psycopg.connect(dbname="${DB_NAME}", user="${DB_USER}", password="${DB_PASSWORD}", host="${DB_HOST}", port=${DB_PORT})
		conn.close()
		print('postgres ready')
		sys.exit(0)
except Exception as e:
		print('waiting for postgres:', e)
		sys.exit(1)
PY
						sleep 2
					done

			- name: Start Flask app in background
				shell: bash
				env:
					FLASK_APP: app.api
				run: |
					nohup python -m flask --app app.api run --host 0.0.0.0 --port 8000 > flask.log 2>&1 &
					echo "Flask started"

			- name: Wait for Flask to be ready
				shell: bash
				run: |
					for i in {1..30}; do
						if curl -sSf ${PROD_BASE_URL}/api/login >/dev/null 2>&1; then
							echo 'flask ready'
							break
						fi
						echo 'waiting for flask...'
						sleep 1
					done || true

			- name: Run tests
				run: |
					python -m unittest discover -s app/tests

