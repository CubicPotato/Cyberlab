---
name: CI Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install ruff yamllint
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint Python
        run: ruff check api/app api/tests

      - name: Lint YAML
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, comments: disable, comments-indentation: disable, trailing-spaces: disable, truthy: disable}}" \
            compose.yaml \
            monitoring/docker-compose.monitoring.yml \
            .github/workflows/ci.yml

      - name: Lint shell scripts
        run: shellcheck scripts/integration_smoke_test.sh

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Lint Wazuh agent Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: monitoring/wazuh-agent/Dockerfile

      - name: Lint Nginx Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: nginx/Dockerfile

      - name: Lint Kali Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: kali/dockerfile

      - name: Run unit tests
        env:
          PYTHONPATH: api
        run: python -m unittest discover -s api/tests -p "test_*.py"

  integration-smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run containerized smoke test
        run: scripts/integration_smoke_test.sh

  security-scans:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python dependency vulnerability scan
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r api/requirements.txt

      - name: Build API image for scanning
        run: docker build -t cyberlab-api:ci ./api

      - name: Run API image vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cyberlab-api:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
